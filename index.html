<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A2580">
<meta name="description" content="JNF Moto: pide tu mototaxi y acuerda el precio con el conductor.">
<title>JNF Moto</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>

:root{
  --brand:#1A2580;--brand-2:#131C66;--gold:#C9A227;--bg:#F6F4EE;--surface:#FFFFFF;--ink:#1A2580;--muted:#5B6472;
  --line:#E3DECF;--field:#F6F4EE;--map:#E7E3D6;--road:#FFFFFF;--park:#D3E0C4;--warn-bg:#FBF1CF;--warn-ink:#5A4300;
  --ok-bg:#E3F1E8;--ok-ink:#1F6F43;--info-bg:#E4E7F6;--info-ink:#1A2580;--danger:#B42318;--danger-text:#B42318;--danger-bg:#FFE9E6;
  --chip-on:#1A2580;--chip-on-ink:#FFFFFF;--star-off:#B9B2A0;--route:#1A2580;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1433;--surface:#181F4D;--ink:#E9ECFA;--muted:#B3BAD6;--line:#2C3570;--field:#11173D;--map:#1B2250;--road:#2D3673;--park:#1F3A3A;
    --warn-bg:#3A3212;--warn-ink:#F3DE9A;--ok-bg:#133526;--ok-ink:#8FE0B3;--info-bg:#232B66;--info-ink:#E9ECFA;--danger-text:#FF8A80;--danger-bg:#3D1614;
    --chip-on:#C9A227;--chip-on-ink:#1A2580;--star-off:#5A6190;--route:#9DB0FF;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1433;--surface:#181F4D;--ink:#E9ECFA;--muted:#B3BAD6;--line:#2C3570;--field:#11173D;--map:#1B2250;--road:#2D3673;--park:#1F3A3A;
  --warn-bg:#3A3212;--warn-ink:#F3DE9A;--ok-bg:#133526;--ok-ink:#8FE0B3;--info-bg:#232B66;--info-ink:#E9ECFA;--danger-text:#FF8A80;--danger-bg:#3D1614;
  --chip-on:#C9A227;--chip-on-ink:#1A2580;--star-off:#5A6190;--route:#9DB0FF;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,-apple-system,"Segoe UI",Helvetica,sans-serif;font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
img{max-width:100%;display:block}
.top{background:var(--brand);color:#FFFFFF;padding:16px 20px 18px;display:flex;flex-direction:column;gap:14px}
.top .sub{color:#D8DEE8;font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:4px;min-width:0}
.grow{flex:1;min-width:0}
.row>input{flex:1;min-width:0}
.pad{padding:16px;display:flex;flex-direction:column;gap:14px}
.h1{margin:0;font-size:21px;font-weight:800;line-height:1.25}
.h2{margin:0;font-size:17px;font-weight:800;line-height:1.3}
.muted{color:var(--muted);font-size:13px}
.small{font-size:12px}
.strong{font-weight:700}
.logo{width:44px;height:44px;flex-shrink:0}
.brandname{font-weight:800;font-size:17px;color:#C9A227;white-space:nowrap}
.iconbtn{width:44px;height:44px;border-radius:22px;border:none;background:rgba(255,255,255,.14);color:#FFFFFF;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.iconbtn.light{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn{min-height:52px;border-radius:14px;border:none;font-weight:800;font-size:16px;padding:12px 16px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;text-decoration:none;width:100%}
.btn-gold{background:var(--gold);color:#1A2580}
.btn-navy{background:var(--brand);color:#FFFFFF}
.btn-ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:700;font-size:14px;min-height:46px}
.btn-danger{background:#B42318;color:#FFFFFF}
.btn-sm{min-height:40px;font-size:13px;padding:8px 14px;width:auto;border-radius:10px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.link{background:none;border:none;color:var(--ink);text-decoration:underline;font-weight:700;font-size:14px;min-height:44px;padding:0 4px;text-align:left}
.link.danger{color:var(--danger-text)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.card.sel{border:2px solid var(--gold)}
.avatar{width:48px;height:48px;border-radius:24px;background:var(--brand);color:#C9A227;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.avatar.lg{width:64px;height:64px;border-radius:32px;font-size:20px;border:3px solid #C9A227}
.price{font-size:22px;font-weight:800;white-space:nowrap}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:10px;white-space:nowrap;display:inline-block}
.p-ok{background:var(--ok-bg);color:var(--ok-ink)}
.p-warn{background:var(--warn-bg);color:var(--warn-ink)}
.p-info{background:var(--info-bg);color:var(--info-ink)}
.p-danger{background:#B42318;color:#FFFFFF}
.banner{border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.45;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:var(--warn-bg);color:var(--warn-ink)}
.banner.ok{background:var(--ok-bg);color:var(--ok-ink)}
.banner.info{background:var(--info-bg);color:var(--info-ink)}
.banner.danger{background:var(--danger-bg);color:var(--danger-text)}
.banner .grow{flex:1}
.banner>button{background:none;border:none;color:inherit;font-weight:700;text-decoration:underline;padding:0 2px;min-height:24px;flex-shrink:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:12px;font-weight:700;color:var(--muted)}
input[type=text],input[type=tel],input[type=number],textarea{min-height:48px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;color:var(--ink);background:var(--field);width:100%}
textarea{min-height:84px;resize:vertical}
.err{color:var(--danger-text);font-size:13px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:13px}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cbtn{min-height:44px;border-radius:12px;border:1px solid var(--ink);background:var(--surface);color:var(--ink);font-weight:700;font-size:14px;padding:4px}
.cbtn.other{border-style:dashed;background:var(--field)}
.stat{background:rgba(255,255,255,.12);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:11px;color:#D8DEE8}
.stat .v{font-weight:800;font-size:17px;white-space:nowrap}
.mapwrap{flex:1 1 auto;min-height:200px;display:flex;background:var(--map)}
.mapwrap svg{flex:1;width:100%;height:100%;min-height:200px;display:block}
.sheet{background:var(--surface);border-radius:24px 24px 0 0;padding:12px 18px 22px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line)}
.handle{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.offerbox{background:var(--field);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px}
.round{width:48px;height:48px;border-radius:24px;border:1px solid var(--ink);background:var(--surface);color:var(--ink);font-size:24px;line-height:1;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.round.solid{background:var(--brand);color:#FFFFFF;border-color:var(--brand)}
.round[disabled]{border-color:var(--line);color:var(--muted);cursor:not-allowed}
.amount{font-size:34px;font-weight:800;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:5px;background:var(--ink);flex-shrink:0}
.sq{width:10px;height:10px;border-radius:2px;background:#C9A227;border:1px solid var(--ink);flex-shrink:0}
.progress{height:4px;border-radius:2px;background:rgba(255,255,255,.2);overflow:hidden}
.progress>div{height:4px;background:#C9A227;width:0;transition:width .6s ease}
.bar{height:8px;border-radius:4px;background:var(--line)}
.bar>div{height:8px;border-radius:4px;background:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;border-radius:16px;background:rgba(255,255,255,.12)}
.seg button{min-height:48px;border-radius:12px;border:none;background:transparent;color:#FFFFFF;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;padding:4px 8px}
.seg button[aria-current="true"]{background:#C9A227;color:#1A2580;font-weight:800}
.seg button[disabled]{color:#B8C0E6;cursor:not-allowed}
.menuitem{min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:none;border:none;border-bottom:1px solid var(--line);color:var(--ink);font-size:15px;font-weight:600;padding:8px 2px;text-align:left;width:100%}
.stars{display:flex;gap:6px;justify-content:center}
.star{width:50px;height:50px;border:none;background:transparent;padding:0;display:flex;align-items:center;justify-content:center}
.toggle{min-height:44px;padding:0 6px 0 14px;border-radius:22px;border:none;font-weight:800;font-size:14px;display:flex;align-items:center;gap:10px;white-space:nowrap;flex-shrink:0}
.toggle.on{background:#C9A227;color:#1A2580}
.toggle.off{background:rgba(255,255,255,.14);color:#FFFFFF}
.knob{width:28px;height:28px;border-radius:14px;display:block}
.toggle.on .knob{background:#1A2580}
.toggle.off .knob{background:#8E97C9}
.docrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.docrow:last-child{border-bottom:none}
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.upl{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:6px 14px;border-radius:10px;border:1px solid var(--ink);color:var(--ink);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.upl:focus-within{outline:3px solid var(--gold);outline-offset:2px}
.sos{min-width:56px;height:44px;border-radius:22px;border:2px solid #FFFFFF;background:#B42318;color:#FFFFFF;font-weight:800;font-size:15px;padding:0 12px;flex-shrink:0}
.plate{border:2px solid var(--ink);border-radius:8px;padding:4px 8px;font-weight:800;font-size:15px;background:var(--warn-bg);color:var(--warn-ink);white-space:nowrap;flex-shrink:0}
.demo{font-size:12px;color:var(--muted);text-align:center;padding:6px 16px 14px}
@media (prefers-reduced-motion: reduce){.progress>div{transition:none}}

.lmap{height:260px;width:100%;background:var(--map);z-index:0}
.lmap.tall{height:300px}
.leaflet-container{font-family:inherit}
.center{text-align:center}
.spinner{width:36px;height:36px;border-radius:50%;border:4px solid var(--line);border-top-color:#C9A227;animation:spin 1s linear infinite;align-self:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spinner{animation-duration:3s}}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{min-height:40px;padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:13px}
.tabs button[aria-current="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45}
.check input{width:22px;height:22px;flex-shrink:0;margin:0;accent-color:#1A2580}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.gbtn{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
input[type=email],input[type=password]{min-height:48px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;color:var(--ink);background:var(--field);width:100%}

</style>
</head>
<body>
<div id="app" aria-live="polite"><div class="screen"><div class="pad" style="flex:1;justify-content:center;align-items:center"><img src="icon-192.png" alt="Logo JNF S.A.S." style="width:96px;height:96px"><noscript><p>JNF Moto necesita JavaScript activado.</p></noscript></div></div></div>
<script type="module" src="app.js?v=1"></script>
</body>
</html>
